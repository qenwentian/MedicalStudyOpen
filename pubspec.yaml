name: anatomy_atlas
description: "A free, open-source 3D interactive anatomy atlas powered by Google Filament via Thermion."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # 3D Rendering — Google Filament via Dart FFI
  thermion_flutter: ^0.5.0

  # Math utilities for camera/entity positioning
  vector_math: ^2.1.4

  # Local SQLite database for anatomical knowledge graph
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # UI icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/3d/
    - assets/db/
